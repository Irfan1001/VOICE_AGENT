<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IST Voice Agent Console</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-1: #ecf3ef;
			--bg-2: #dbe9e2;
			--panel: rgba(255, 255, 255, 0.82);
			--ink: #13261d;
			--muted: #5b6d62;
			--brand: #0b6b3c;
			--brand-dark: #064a2a;
			--brand-soft: rgba(11, 107, 60, 0.12);
			--danger: #a62d2d;
			--line: rgba(16, 36, 23, 0.12);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Manrope", "Segoe UI", sans-serif;
			background:
				radial-gradient(circle at 8% 15%, rgba(11, 107, 60, 0.17), transparent 24%),
				radial-gradient(circle at 92% 85%, rgba(18, 103, 139, 0.14), transparent 28%),
				linear-gradient(155deg, var(--bg-1) 0%, var(--bg-2) 100%);
			color: var(--ink);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.shell {
			width: min(760px, 100%);
			background: var(--panel);
			backdrop-filter: blur(14px);
			border: 1px solid var(--line);
			border-radius: 28px;
			box-shadow: 0 28px 75px rgba(8, 70, 40, 0.15);
			overflow: hidden;
			animation: riseIn 420ms ease-out;
		}

		.hero {
			padding: 28px 28px 18px;
			background:
				radial-gradient(circle at 82% 15%, rgba(140, 232, 189, 0.22), transparent 32%),
				linear-gradient(135deg, rgba(11, 107, 60, 0.97), rgba(5, 54, 32, 0.98));
			color: #f6fff8;
		}

		.hero h1 {
			margin: 0;
			font-family: "Space Grotesk", "Manrope", sans-serif;
			font-size: clamp(1.8rem, 4vw, 2.6rem);
			line-height: 1.05;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		.hero p {
			margin: 12px 0 0;
			max-width: 52ch;
			color: rgba(246, 255, 248, 0.82);
		}

		.hero-badges {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: 12px;
		}

		.hero-badge {
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.07em;
			text-transform: uppercase;
			border-radius: 999px;
			padding: 7px 10px;
			background: rgba(244, 255, 249, 0.16);
			border: 1px solid rgba(244, 255, 249, 0.34);
		}

		.content {
			padding: 22px 24px 24px;
			display: grid;
			gap: 18px;
		}

		.panel {
			border: 1px solid var(--line);
			border-radius: 20px;
			padding: 18px;
			background: rgba(255, 255, 255, 0.8);
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
		}

		.metrics {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
			gap: 12px;
		}

		.metric-label {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--muted);
		}

		.metric-value {
			margin-top: 6px;
			font-size: 1rem;
			font-weight: 700;
		}

		.controls {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}

		button {
			border: 0;
			border-radius: 999px;
			padding: 14px 20px;
			font-size: 0.95rem;
			font-weight: 700;
			font-family: "Space Grotesk", "Manrope", sans-serif;
			letter-spacing: 0.03em;
			text-transform: uppercase;
			cursor: pointer;
			transition: transform 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
		}

		button:hover:not(:disabled) {
			transform: translateY(-1px);
		}

		button:disabled {
			opacity: 0.45;
			cursor: not-allowed;
		}

		.call-btn {
			background: linear-gradient(135deg, var(--brand), var(--brand-dark));
			color: white;
			box-shadow: 0 12px 24px rgba(11, 107, 60, 0.22);
		}

		.end-btn {
			background: linear-gradient(135deg, #ffe9e9, #ffe0e0);
			color: var(--danger);
		}

		.vad-pill {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 10px 14px;
			border-radius: 999px;
			background: rgba(16, 36, 23, 0.06);
			font-weight: 600;
		}

		.vad-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #b9c7bc;
			transition: background 120ms ease, box-shadow 120ms ease;
		}

		.vad-dot.active {
			background: #18b05c;
			box-shadow: 0 0 0 8px rgba(24, 176, 92, 0.14);
		}

		.transcript-list {
			display: grid;
			gap: 12px;
			max-height: 380px;
			overflow: auto;
		}

		.message {
			padding: 14px 16px;
			border-radius: 16px;
			line-height: 1.45;
			font-size: 0.97rem;
		}

		.message.user {
			background: #ecf8f1;
			border: 1px solid rgba(11, 107, 60, 0.12);
		}

		.message.user.interim {
			background: #f5faf6;
			border: 1px dashed rgba(11, 107, 60, 0.25);
			color: var(--muted);
			font-style: italic;
		}

		.message.bot {
			background: #fff7e8;
			border: 1px solid rgba(163, 113, 18, 0.12);
		}

		@keyframes riseIn {
			from {
				opacity: 0;
				transform: translateY(10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message small {
			display: block;
			margin-bottom: 6px;
			font-size: 0.76rem;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: var(--muted);
		}

		@media (max-width: 640px) {
			body {
				padding: 14px;
			}

			.hero,
			.content {
				padding-left: 18px;
				padding-right: 18px;
			}
		}
	</style>
</head>
<body>
	<div class="shell">
		<section class="hero">
			<h1>IST Voice Agent</h1>
			<p>Institute of Space and Technology (IST) assistant console for admissions, programs, and campus information.</p>
			<div class="hero-badges">
				<span class="hero-badge">Institute of Space and Technology</span>
				<span class="hero-badge">Live Transcript Monitor</span>
			</div>
		</section>

		<section class="content">
			<div class="metrics">
				<div class="panel">
					<div class="metric-label">Call Status</div>
					<div class="metric-value" id="status">Idle</div>
				</div>
				<div class="panel">
					<div class="metric-label">Connection</div>
					<div class="metric-value" id="connectionState">Disconnected</div>
				</div>
				<div class="panel">
					<div class="metric-label">Voice Activity</div>
					<div class="metric-value">
						<span class="vad-pill"><span id="vadDot" class="vad-dot"></span><span id="vadText">Waiting</span></span>
					</div>
				</div>
			</div>

			<div class="panel controls">
				<button id="dialBtn" class="call-btn">Dial a Call</button>
				<button id="hangupBtn" class="end-btn" disabled>End Call</button>
			</div>

			<div class="panel">
				<div class="metric-label">Transcripts</div>
				<div id="transcriptList" class="transcript-list"></div>
			</div>
		</section>
	</div>
<script>

const WORKLET_CODE = `
class MicProcessor extends AudioWorkletProcessor {
	process(inputs) {
		const channel = inputs[0] && inputs[0][0];
		if (!channel) return true;
		const int16 = new Int16Array(channel.length);
		for (let i = 0; i < channel.length; i++) {
			const value = Math.max(-1, Math.min(1, channel[i]));
			int16[i] = value < 0 ? value * 0x8000 : value * 0x7fff;
		}
		this.port.postMessage({ buf: int16.buffer }, [int16.buffer]);
		return true;
	}
}
registerProcessor("mic-proc", MicProcessor);
`;

function decodeBase64ToBytes(base64Text) {
	const binary = atob(base64Text);
	const bytes = new Uint8Array(binary.length);
	for (let index = 0; index < binary.length; index += 1) {
		bytes[index] = binary.charCodeAt(index);
	}
	return bytes;
}

function createPCMStreamPlayer(options = {}) {
	const onStateChange = options.onStateChange || (() => {});
	let context = null;
	let gainNode = null;
	let currentReplyId = null;
	let sampleRate = 24000;
	let nextPlayTime = 0;
	let replyOpen = false;
	let activeSources = new Set();
	let stateTimer = null;

	function clearStateTimer() {
		if (!stateTimer) return;
		clearTimeout(stateTimer);
		stateTimer = null;
	}

	function hasScheduledAudio() {
		return Boolean(context) && nextPlayTime > context.currentTime + 0.02;
	}

	function emitState() {
		onStateChange({
			playing: activeSources.size > 0 || hasScheduledAudio(),
			queued: replyOpen || activeSources.size > 0 || hasScheduledAudio(),
		});

		if (!replyOpen && hasScheduledAudio()) {
			clearStateTimer();
			stateTimer = setTimeout(() => {
				stateTimer = null;
				emitState();
			}, Math.max(40, ((nextPlayTime - context.currentTime) * 1000) + 40));
		}
	}

	return {
		bindContext(nextContext) {
			context = nextContext;
			if (!context) return;
			if (gainNode) {
				try {
					gainNode.disconnect();
				} catch (_) {
					// no-op
				}
			}
			gainNode = context.createGain();
			gainNode.gain.value = 1;
			gainNode.connect(context.destination);
			nextPlayTime = context.currentTime;
			emitState();
		},

		startReply(replyId, nextSampleRate) {
			this.stopReply();
			currentReplyId = replyId;
			sampleRate = nextSampleRate || 24000;
			replyOpen = true;
			nextPlayTime = context ? context.currentTime + 0.05 : 0;
			emitState();
		},

		appendChunk(replyId, base64Audio) {
			if (!context || !gainNode || replyId !== currentReplyId || !base64Audio) return;

			const bytes = decodeBase64ToBytes(base64Audio);
			const sampleCount = Math.floor(bytes.byteLength / 2);
			if (!sampleCount) return;

			const pcm = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
			const channelData = new Float32Array(sampleCount);
			for (let index = 0; index < sampleCount; index += 1) {
				channelData[index] = pcm.getInt16(index * 2, true) / 32768;
			}

			const audioBuffer = context.createBuffer(1, sampleCount, sampleRate);
			audioBuffer.copyToChannel(channelData, 0);

			const source = context.createBufferSource();
			source.buffer = audioBuffer;
			source.connect(gainNode);

			const startAt = Math.max(nextPlayTime, context.currentTime + 0.02);
			source.start(startAt);
			nextPlayTime = startAt + audioBuffer.duration;

			activeSources.add(source);
			source.onended = () => {
				activeSources.delete(source);
				emitState();
			};

			emitState();
		},

		finishReply(replyId) {
			if (replyId !== currentReplyId) return;
			replyOpen = false;
			emitState();
		},

		stopReply(replyId = null) {
			if (replyId !== null && replyId !== currentReplyId) return;
			clearStateTimer();
			replyOpen = false;
			for (const source of activeSources) {
				try {
					source.stop(0);
				} catch (_) {
					// no-op
				}
			}
			activeSources = new Set();
			currentReplyId = null;
			nextPlayTime = context ? context.currentTime : 0;
			emitState();
		},

		dispose() {
			this.stopReply();
			if (gainNode) {
				try {
					gainNode.disconnect();
				} catch (_) {
					// no-op
				}
			}
			gainNode = null;
			context = null;
		},
	};
}

let ws = null;
let audioCtx = null;
let workletNode = null;
let micStream = null;
let callActive = false;
let interimEl = null;
let botStreamingEl = null;
let userSpeaking = false;
let processingTurn = false;
let agentStreaming = false;
let ttsState = { playing: false, queued: false };
const statusEl = document.getElementById("status");
const connEl = document.getElementById("connectionState");
const vadDotEl = document.getElementById("vadDot");
const vadTextEl = document.getElementById("vadText");
const logEl = document.getElementById("transcriptList");
const dialBtn = document.getElementById("dialBtn");
const hangBtn = document.getElementById("hangupBtn");
const ttsPlayer = createPCMStreamPlayer({
	onStateChange(state) {
		ttsState = state;
		refreshCallState();
	},
});

function setStatus(text) {
	statusEl.textContent = text;
}

function setConn(text) {
	connEl.textContent = text;
}

function setVAD(active, text) {
	vadDotEl.classList.toggle("active", active);
	vadTextEl.textContent = text;
}

function refreshCallState() {
	if (!callActive) {
		return;
	}

	if (userSpeaking) {
		setStatus("Listening");
		setVAD(true, "Voice detected");
		return;
	}

	if (processingTurn) {
		setStatus("Processing");
		setVAD(false, "Processing");
		return;
	}

	if (ttsState.playing || ttsState.queued) {
		setStatus("Speaking");
		setVAD(false, "Assistant speaking");
		return;
	}

	if (agentStreaming) {
		setStatus("Generating response");
		setVAD(false, "Assistant responding");
		return;
	}

	setStatus("Listening");
	setVAD(false, "Waiting for speech");
}

function addMessage(role, text) {
	const wrapper = document.createElement("div");
	wrapper.className = `message ${role}`;
	const label = document.createElement("small");
	label.textContent = role.startsWith("user") ? "Caller" : "IST Agent";
	const body = document.createElement("div");
	body.textContent = text;
	wrapper.append(label, body);
	logEl.append(wrapper);
	logEl.scrollTop = logEl.scrollHeight;
	return body;
}

function clearInterimMessage() {
	if (!interimEl) return;
	interimEl.closest(".message")?.remove();
	interimEl = null;
}

function ensureInterimMessage() {
	if (!interimEl) interimEl = addMessage("user interim", "…");
	return interimEl;
}

function ensureBotStreamingMessage() {
	if (!botStreamingEl) botStreamingEl = addMessage("bot", "");
	return botStreamingEl;
}

function handleServerEvent(event) {
	switch (event.type) {
		case "ready":
			userSpeaking = false;
			processingTurn = false;
			agentStreaming = false;
			refreshCallState();
			break;

		case "speech_started":
			ttsPlayer.stopReply();
			userSpeaking = true;
			processingTurn = false;
			ensureInterimMessage();
			refreshCallState();
			break;

		case "transcript_interim":
			if (event.text) {
				ensureInterimMessage().textContent = event.text;
				logEl.scrollTop = logEl.scrollHeight;
			}
			break;

		case "speech_ended":
			clearInterimMessage();
			userSpeaking = false;
			processingTurn = true;
			refreshCallState();
			break;

		case "transcript":
			clearInterimMessage();
			userSpeaking = false;
			processingTurn = true;
			if (event.text) addMessage("user", event.text);
			refreshCallState();
			break;

		case "agent_started":
			processingTurn = false;
			agentStreaming = true;
			refreshCallState();
			break;

		case "agent_delta":
			if (event.text) {
				ensureBotStreamingMessage().textContent += event.text;
				logEl.scrollTop = logEl.scrollHeight;
			}
			break;

		case "agent_text":
			if (event.text) ensureBotStreamingMessage().textContent = event.text;
			break;

		case "agent_done":
			agentStreaming = false;
			botStreamingEl = null;
			refreshCallState();
			break;

		case "tts_started":
			ttsPlayer.startReply(event.reply_id, event.sample_rate);
			break;

		case "tts_chunk":
			ttsPlayer.appendChunk(event.reply_id, event.audio);
			break;

		case "tts_done":
			ttsPlayer.finishReply(event.reply_id);
			break;

		case "tts_stopped":
			ttsPlayer.stopReply(event.reply_id);
			refreshCallState();
			break;

		case "tts_error":
			ttsPlayer.stopReply(event.reply_id);
			setStatus(`TTS error: ${event.msg || "unknown"}`);
			setVAD(false, "Waiting for speech");
			break;

		case "agent_error":
			agentStreaming = false;
			processingTurn = false;
			ttsPlayer.stopReply();
			botStreamingEl = null;
			setStatus(`Agent error: ${event.msg || "unknown"}`);
			setVAD(false, "Waiting for speech");
			break;

		case "error":
			setStatus(`Error: ${event.msg || "unknown"}`);
			break;

		default:
			break;
	}
}

async function startCall() {
	dialBtn.disabled = true;
	setStatus("Starting...");
	setConn("Connecting");

	try {
		audioCtx = new AudioContext({ sampleRate: 48000 });
		await audioCtx.resume();
		ttsPlayer.bindContext(audioCtx);

		micStream = await navigator.mediaDevices.getUserMedia({
			audio: {
				channelCount: 1,
				sampleRate: 48000,
				echoCancellation: true,
				noiseSuppression: true,
				autoGainControl: true,
			},
		});

		const blobUrl = URL.createObjectURL(
			new Blob([WORKLET_CODE], { type: "application/javascript" })
		);
		await audioCtx.audioWorklet.addModule(blobUrl);
		URL.revokeObjectURL(blobUrl);

		workletNode = new AudioWorkletNode(audioCtx, "mic-proc");
		audioCtx.createMediaStreamSource(micStream).connect(workletNode);

		const proto = location.protocol === "https:" ? "wss" : "ws";
		ws = new WebSocket(`${proto}://${location.host}/ws`);

		ws.onopen = () => {
			callActive = true;
			userSpeaking = false;
			processingTurn = false;
			agentStreaming = false;
			clearInterimMessage();
			botStreamingEl = null;
			ttsPlayer.stopReply();
			hangBtn.disabled = false;
			setConn("Connected");
			refreshCallState();

			workletNode.port.onmessage = ({ data }) => {
				if (!callActive || !ws || ws.readyState !== WebSocket.OPEN) return;
				const { buf } = data;
				ws.send(buf);
			};
		};

		ws.onmessage = ({ data }) => {
			try {
				handleServerEvent(JSON.parse(data));
			} catch (_) {
				// no-op
			}
		};

		ws.onerror = () => {
			setConn("Error");
			setStatus("Connection error");
			endCall({ preserveError: true });
		};

		ws.onclose = () => {
			if (callActive) endCall();
		};
	} catch (error) {
		setStatus(`Could not start: ${error.message}`);
		setConn("Disconnected");
		cleanup();
		dialBtn.disabled = false;
	}
}

function endCall(options = {}) {
	const preserveError = Boolean(options.preserveError);
	callActive = false;
	userSpeaking = false;
	processingTurn = false;
	agentStreaming = false;
	clearInterimMessage();
	botStreamingEl = null;
	ttsPlayer.stopReply();
	if (ws && ws.readyState === WebSocket.OPEN) {
		ws.send(JSON.stringify({ type: "hangup" }));
	}
	cleanup();
	if (!preserveError) {
		setStatus("Idle");
	}
	setConn("Disconnected");
	setVAD(false, "Waiting");
	dialBtn.disabled = false;
	hangBtn.disabled = true;
}

function cleanup() {
	if (workletNode) {
		try {
			workletNode.disconnect();
		} catch (_) {
			// no-op
		}
		workletNode = null;
	}

	if (micStream) {
		micStream.getTracks().forEach((track) => track.stop());
		micStream = null;
	}

	if (audioCtx) {
		audioCtx.close().catch(() => {});
		audioCtx = null;
	}

	ttsPlayer.dispose();

	if (ws) {
		try {
			ws.close();
		} catch (_) {
			// no-op
		}
		ws = null;
	}
}

dialBtn.addEventListener("click", startCall);
hangBtn.addEventListener("click", endCall);
</script>
</body>
</html>
